name: driver_app
description: "Minimal driver app for the Real-Time Bus Reservation & Tracking System demo."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.4.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - .env