<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guzo Bus — Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: linear-gradient(135deg, #0b1220 0%, #1a2332 100%);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 20px;
      }

      /* The "phone" — fixed dimensions roughly matching a modern phone
       viewport (390x844, iPhone-13-ish). This is a desktop/projector
       presentation aid only; see the mobile fallback below. */
      .phone-frame {
        position: relative;
        width: 390px;
        height: 844px;
        background: #000;
        border-radius: 48px;
        padding: 14px;
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.5),
          0 0 0 2px rgba(255, 255, 255, 0.08) inset;
      }

      .phone-screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 34px;
        overflow: hidden;
        background: #fff;
      }

      .phone-frame iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* The notch — purely cosmetic, sits above the iframe content */
      .notch {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 26px;
        background: #000;
        border-radius: 0 0 16px 16px;
        z-index: 10;
      }

      .demo-label {
        color: rgba(255, 255, 255, 0.6);
        font-size: 13px;
        letter-spacing: 0.5px;
        text-align: center;
      }

      /* On an actual phone (or a narrow window), showing a phone-frame
       around an iframe just wastes screen space — go fullscreen instead. */
      @media (max-width: 480px),
        (max-height: 900px) and (orientation: portrait) and (max-width: 500px) {
        .phone-frame {
          width: 100vw;
          height: 100vh;
          border-radius: 0;
          padding: 0;
          box-shadow: none;
        }
        .phone-screen {
          border-radius: 0;
        }
        .notch {
          display: none;
        }
        .demo-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone-frame">
      <div class="notch"></div>
      <div class="phone-screen">
        <iframe
          src="./index.html"
          title="Guzo Bus App"
          allow="geolocation; camera"
        ></iframe>
      </div>
    </div>
    <div class="demo-label">Guzo Bus — Passenger App Demo</div>
  </body>
</html>
