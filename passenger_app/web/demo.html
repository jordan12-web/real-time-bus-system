<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guzo Bus — Demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: linear-gradient(135deg,#0b1220 0%,#1a2332 100%); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow: hidden; }
      body { display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; padding:20px; }
      .phone-frame { position:relative; background:#000; border-radius:40px; padding:10px; box-shadow:0 25px 60px rgba(0,0,0,.5), 0 0 0 2px rgba(255,255,255,.08) inset; transition:width .15s ease, height .15s ease; }
      .phone-screen { width:100%; height:100%; border-radius:28px; overflow:hidden; background:#fff; }
      .phone-frame iframe { width:100%; height:100%; border:0; display:block; }
      .demo-label { color:rgba(255,255,255,.6); font-size:13px; letter-spacing:.5px; text-align:center; }
      body.fullscreen { padding:0; gap:0; }
      body.fullscreen .phone-frame { width:100vw !important; height:100vh !important; border-radius:0; padding:0; box-shadow:none; }
      body.fullscreen .phone-screen { border-radius:0; }
      body.fullscreen .demo-label { display:none; }
    </style>
  </head>
  <body>
    <div class="phone-frame" id="phoneFrame">
      <div class="phone-screen">
        <iframe id="appFrame" src="./index.html" title="Guzo Bus App" allow="geolocation; camera; microphone; clipboard-read; clipboard-write"></iframe>
      </div>
    </div>
    <div class="demo-label">Guzo Bus — Passenger App Demo</div>

    <script>
      // Unregister any service workers for this origin to avoid stale cached demo files
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(()=>{});
      }

      // Cache-bust the iframe so each load requests a fresh index.html
      const frame = document.getElementById('appFrame');
      frame.src = './index.html?ts=' + Date.now();

      // Phone sizing logic (iPhone-ish logical aspect)
      const PHONE_ASPECT = 390 / 844;
      const MAX_HEIGHT = 900;
      const MOBILE_BREAKPOINT = 480;

      function resizeFrame() {
        const frameWrap = document.getElementById('phoneFrame');
        const body = document.body;
        const winW = window.innerWidth;
        const winH = window.innerHeight;

        if (winW <= MOBILE_BREAKPOINT) {
          body.classList.add('fullscreen');
          frameWrap.style.width = '';
          frameWrap.style.height = '';
          return;
        }
        body.classList.remove('fullscreen');

        const availableW = winW * 0.9;
        const availableH = (winH - 40) * 0.92;

        let height = Math.min(availableH, MAX_HEIGHT);
        let width = height * PHONE_ASPECT;

        if (width > availableW) {
          width = availableW;
          height = width / PHONE_ASPECT;
        }

        frameWrap.style.width = Math.round(width) + 'px';
        frameWrap.style.height = Math.round(height) + 'px';
      }

      window.addEventListener('resize', resizeFrame);
      window.addEventListener('orientationchange', resizeFrame);
      resizeFrame();
    </script>
  </body>
</html>
